# Four-client ECG system with weighted gated aggregation (redesign approved 2026-10-15).
# Every client sees the same input (100 Hz 12-lead signal, (12, 1000)) and the same 5-superclass
# multi-label task; they differ in architecture and in which training folds they get.
fourclient:
  # Official PTB-XL folds: 1-8 train (split across clients), 9 validation (early stopping,
  # temperature, thresholds, aggregation weights), 10 untouched test.
  partition:
    A: [1, 2]
    B: [3, 4]
    C: [5, 6]
    D: [7, 8]
  val_fold: 9
  test_fold: 10
  clients:
    A: {arch: cnn1d}
    B: {arch: resnet1d}
    C: {arch: bilstm}
    D: {arch: cnn_lstm}
  baselines:                      # reference models, not part of the ensemble
    ALL: {arch: cnn_lstm, folds: [1, 2, 3, 4, 5, 6, 7, 8]}   # one model on all training data
  embed_dim: 256
  dropout: 0.3
  train:                          # identical for every client so only architecture/data differ
    epochs: 50
    batch_size: 128
    lr: 1.0e-3
    weight_decay: 1.0e-2
    schedule: onecycle
    patience: 8
    num_workers: 4
    eval_batch_size: 128           # 512 runs the BiLSTM out of MPS memory
  gate:
    cv_folds: 5                   # patient-grouped CV inside fold 9 to choose static vs dynamic
    min_gain: 0.002               # a more complex combiner (equal < static < dynamic) must beat the simpler by this CV AUROC
    static:
      lr: 0.05
      steps: 500
    dynamic:
      hidden: 32
      dropout: 0.2
      lr: 1.0e-3
      weight_decay: 1.0e-2
      epochs: 300
      patience: 30
      batch_size: 128
  # Per-finding triage (rule-in / rule-out) on the selected combiner, fitted on fold-9 CV
  # predictions by `python -m cardiomoe.fourclient.triage` (see triage.py). Approved by the owner
  # on 2026-10-19, before applying it to fold 10.
  triage:
    targets:                      # on auto-decided findings of an "automated" class
      precision: 0.90
      recall: 0.90
      accuracy: 0.90
    margin: 0.02                  # required on fold 9 on top of the targets
    min_positive_auto: 0.10       # >= 10% of a class's true positives must be auto-reported
    rule_out:                     # fallback: auto-report only confident negatives
      min_npv: 0.95
      max_missed: 0.05            # at most 5% of the class's positives may be auto-ruled-out
    grid: 201
  bootstrap: 1000
  out_dir: outputs/fourclient
